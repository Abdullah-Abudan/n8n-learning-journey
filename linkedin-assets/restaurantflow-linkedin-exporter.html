const root=document.getElementById('cards');
items.forEach((item,index)=>{
 const card=document.createElement('section');card.className='card';
 const preview=document.createElement('div');preview.className='preview';
 const img=document.createElement('img');img.src=item.src;img.alt=item.name;preview.appendChild(img);
 const title=document.createElement('h2');title.textContent=item.name;
 const desc=document.createElement('p');desc.className='desc';desc.textContent=item.desc;
 const btn=document.createElement('button');btn.textContent='Download PNG';
 btn.addEventListener('click',()=>exportImage(item,index));
 card.append(preview,title,desc,btn);root.appendChild(card);
});
function exportImage(item,index){
 const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1500;
 const ctx=canvas.getContext('2d');
 const bg=ctx.createLinearGradient(0,0,1200,1500);bg.addColorStop(0,'#071b3d');bg.addColorStop(1,'#102e5b');ctx.fillStyle=bg;ctx.fillRect(0,0,1200,1500);
 ctx.fillStyle='#f4bd36';ctx.fillRect(80,82,10,58);
 ctx.fillStyle='#f4bd36';ctx.font='700 25px Arial';ctx.fillText('RESTAURANTFLOW  /  AUTOMATION PROJECT',116,108);
 ctx.fillStyle='#f5f7fb';ctx.font='700 48px Arial';ctx.fillText(item.kicker,80,205);
 ctx.fillStyle='#c3d0e2';ctx.font='24px Arial';wrapText(ctx,item.desc,80,255,1040,36);
 ctx.fillStyle='#132b50';roundRect(ctx,65,350,1070,1010,26);ctx.fill();
 const img=new Image();img.onload=()=>{
  const maxW=1010,maxH=900,scale=Math.min(maxW/img.width,maxH/img.height);
  const w=img.width*scale,h=img.height*scale,x=(1200-w)/2,y=390+(900-h)/2;
  ctx.save();roundRect(ctx,95,380,1010,940,16);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(95,380,1010,940);ctx.drawImage(img,x,y,w,h);ctx.restore();
  ctx.fillStyle='#f4bd36';ctx.fillRect(80,1400,1040,3);
  ctx.fillStyle='#dce5f2';ctx.font='20px Arial';ctx.fillText('ORDER MANAGEMENT  •  TELEGRAM  •  GOOGLE SHEETS  •  n8n',80,1445);
  const a=document.createElement('a');a.download='restaurantflow-'+(index+1)+'.png';a.href=canvas.toDataURL('image/png');a.click();
 };img.src=item.src;
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){let words=text.split(' '),line='';for(let n=0;n<words.length;n++){let test=line+words[n]+' ';if(ctx.measureText(test).width>maxWidth&&n>0){ctx.fillText(line,x,y);line=words[n]+' ';y+=lineHeight}else line=test}ctx.fillText(line,x,y)}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
